name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug 2>&1 | tee build_output.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
          retention-days: 7

      - name: Collect APK
        run: |
          mkdir -p apk-output
          find . -name "*.apk" -type f -exec cp {} apk-output/ \;
          ls -la apk-output/
          echo "APK files found: $(ls apk-output/*.apk 2>/dev/null | wc -l)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guitar-trainer-debug
          path: apk-output/
          retention-days: 30
          if-no-files-found: error
