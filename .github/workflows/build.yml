name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Build debug APK
        run: gradle assembleDebug 2>&1 | tee build_output.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
          retention-days: 7

      - name: Prepare APK
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f -ls 2>/dev/null || true
          find /home -name "*.apk" -type f -ls 2>/dev/null || true
          echo "=== Copying APK ==="
          mkdir -p artifact
          find . -name "app-debug.apk" -type f -exec cp {} artifact/ \; 2>/dev/null || true
          find /home -name "app-debug.apk" -type f -exec cp {} artifact/ \; 2>/dev/null || true
          if [ ! -f artifact/app-debug.apk ]; then
            echo "app-debug.apk not found, trying any .apk"
            find . /home -name "*.apk" -type f -exec cp {} artifact/ \; 2>/dev/null || true
          fi
          echo "=== Artifact contents ==="
          ls -la artifact/ || echo "artifact dir empty"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guitar-trainer-debug
          path: artifact/
          retention-days: 30
