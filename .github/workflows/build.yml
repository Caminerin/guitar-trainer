name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build_output.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
          retention-days: 7

      - name: Verify and upload APK
        run: |
          echo "=== All APK files ==="
          find / -name "*.apk" -type f 2>/dev/null || true
          echo "=== Expected path ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Expected dir does not exist"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guitar-trainer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
